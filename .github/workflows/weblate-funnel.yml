# Funnel real Weblate translations from the `weblate` staging branch into `dev`.
#
# Weblate pushes to the long-lived `weblate` branch: every translation, but also
# an empty target file the moment a language is *added* (0% translated) and
# pure-reformatting churn on files it touches. Merging `weblate` -> `dev`
# wholesale would drag all of that in (see the closed #553). This workflow funnels
# ONLY the real translations:
#
#   1. tools/weblate_funnel.py copies a language file from `weblate` into the tree
#      only when its non-empty translated values differ from dev's - so empty
#      languages and formatting-only diffs are dropped.
#   2. The lang gate (lang_test + plugin_lang_test) runs over exactly the imported
#      languages (LANG_TEST_EXTRA_CODES), so an orphan key or a reordered/dropped
#      %s never reaches dev. If the gate fails, NO PR is opened.
#   3. On success it opens/updates a `chore/weblate-funnel` -> `dev` PR for a human
#      to review and merge. It does NOT auto-merge (community content stays gated
#      behind a maintainer).
#
# `schedule` fires from the default branch (master), so it activates once this
# file reaches master via the next dev -> master promote; `workflow_dispatch` works
# from `dev` immediately (Actions UI -> Run workflow -> branch: dev).

name: Weblate funnel

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weblate-funnel
  cancel-in-progress: false

jobs:
  funnel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Fetch the weblate staging branch
        run: git fetch origin weblate:refs/remotes/origin/weblate

      - name: Filter real translations into the tree
        id: filter
        run: python3 tools/weblate_funnel.py

      - name: Nothing to funnel
        if: steps.filter.outputs.changed != '1'
        run: echo "::notice::No new Weblate translations to funnel."

      - name: Install Lua 5.4 (lang gate)
        if: steps.filter.outputs.changed == '1'
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Lang gate over the imported languages
        if: steps.filter.outputs.changed == '1'
        env:
          LANG_TEST_EXTRA_CODES: ${{ steps.filter.outputs.langs }}
        run: |
          lua5.4 tests/unit/lang_test.lua
          lua5.4 tests/unit/plugin_lang_test.lua

      - name: Open or update the funnel PR
        if: steps.filter.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          LANGS: ${{ steps.filter.outputs.langs }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="chore/weblate-funnel"
          git checkout -B "$branch"
          git add lang scripts/lang
          if git diff --cached --quiet; then
            echo "::notice::Filter reported changes but the tree is clean - nothing to commit."
            exit 0
          fi
          git commit -m "i18n: funnel Weblate translations (${LANGS})"
          git push -f origin "$branch"
          body=$(cat <<EOF
          Automated funnel of real Weblate translations from the \`weblate\` staging branch.

          **Languages:** ${LANGS}

          Only files whose non-empty translated values differ from \`dev\` are included; empty (untranslated) languages and formatting-only diffs are filtered out. The lang gate (\`lang_test\` + \`plugin_lang_test\`) ran over these languages in the funnel workflow (orphan keys + %s/%d placeholder-signature parity) before this PR was opened - see the run that produced it.

          Review and merge (squash). Generated by \`.github/workflows/weblate-funnel.yml\`.
          EOF
          )
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --base dev --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
            echo "::notice::Updated existing funnel PR #$existing"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base dev --head "$branch" \
              --title "i18n: funnel Weblate translations (${LANGS})" --body "$body"
          fi
